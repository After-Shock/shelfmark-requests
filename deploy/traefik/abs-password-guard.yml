# Audiobookshelf has no setting to stop users changing their own password, so
# Traefik asks the requests site first. Admins/root pass; everyone else gets a
# 403 pointing them to books.sullyflix.com, which keeps passwords in sync.
# Admin password resets for other users (PATCH /api/users/:id) are untouched.
# Installed on the host as /opt/traefik/abs-password-guard.yml (file provider).
http:
  routers:
    abs-password-guard:
      rule: "Host(`audiobooks.sullyflix.com`) && (Path(`/api/me/password`) || Path(`/audiobookshelf/api/me/password`))"
      entryPoints:
        - websecure
      priority: 100
      service: audiobookshelf@docker
      middlewares:
        - abs-password-guard
        - globalHeaders@file
        - secureHeaders@file
      tls:
        certResolver: cfdns
        options: securetls@file
  middlewares:
    abs-password-guard:
      forwardAuth:
        address: "http://shelfmark:8084/api/internal/abs-password-guard"
